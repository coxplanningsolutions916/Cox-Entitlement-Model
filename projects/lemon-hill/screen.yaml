  - {approval: "Site Plan and Design Review", body: "Planning and Design Commission", typical: "with the rezone", source: {document: "Lemon Hill Entitlement Roadmap, section 6", revised: "2026-09-15"}, confidence: derived}
  - {approval: "CEQA: Class 32 infill exemption (MND tiering off the 2040 Master EIR as the fallback)", body: "City of Sacramento, lead agency", typical: "with the applications", assumption: assume.ceqa_pathway}

