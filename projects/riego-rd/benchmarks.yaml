    label: "Swainson's hawk foraging land"
    value: 17840
    unit: per_acre
    source: "City of Elk Grove in-lieu fee, effective 2026-07-01"
    applicability: {jurisdiction: ["City of Elk Grove"], max_project_acres: 40, program_type: in_lieu_fee}
