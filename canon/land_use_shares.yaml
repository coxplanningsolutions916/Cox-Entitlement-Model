# Land-use share tables by product type: the planning rules of thumb the Scenarios level uses to estimate programs on
# the constraints map without drawing (strategy doc v2, 2 Oct 2026). Ranges, not points; every figure is a planning
# parameter the planner confirms, and the casebook replaces them with Cox's own project averages as cases accrue.
# Sources: ULI development handbooks and the Best-Fit Market Analysis Screening (Cox, 15 Sept 2026) for multifamily
# densities; Quimby Act (Gov. Code 66477) for the park share basis; subdivision shares from standard site-planning texts.
confidence: derived
products:
  rural_residential:
    label: "Rural residential lots"
    density_basis: net          # density applies after the shares below are removed
    shares: {roads_and_right_of_way: [0.10, 0.15], drainage_and_detention: [0.03, 0.06], open_space_and_buffers: [0.05, 0.15]}
    lot_options: {"one acre": [0.80, 0.95], "two acres": [0.42, 0.48], "two and a half acres": [0.34, 0.38], "five acres": [0.17, 0.19]}
    default_lot: "two and a half acres"
    unit: lots
  single_family_subdivision:
    label: "Single-family subdivision"
    density_basis: net
    shares: {roads_and_right_of_way: [0.20, 0.25], drainage_and_detention: [0.05, 0.10], parks_and_open_space: [0.08, 0.15], other_public_and_utilities: [0.02, 0.05]}
    lot_options: {"5,000 sf": [7.0, 8.0], "6,000 sf": [6.0, 7.0], "7,200 sf": [5.0, 6.0], "10,000 sf": [3.5, 4.5]}
    default_lot: "6,000 sf"
    unit: lots
  townhomes_attached:
    label: "For-sale attached townhomes"
    density_basis: gross
    density: [12, 18]
    shares: {internal_drives_and_parking: [0.25, 0.35], open_space_and_landscape: [0.15, 0.25], building_footprint: [0.25, 0.35]}
    unit: units
    needs_map: true             # for-sale: a subdivision or condominium map
  garden_multifamily:
    label: "Garden walk-up apartments, surface parking"
    density_basis: gross
    density: [15, 25]
    shares: {internal_drives_and_parking: [0.30, 0.40], drainage_and_lid: [0.03, 0.06], open_space_and_landscape: [0.15, 0.25], building_footprint: [0.20, 0.30]}
    unit: units
  tuck_under_multifamily:
    label: "Three-story garden apartments with tuck-under parking"
    density_basis: gross
    density: [20, 30]
    shares: {internal_drives_and_parking: [0.25, 0.35], drainage_and_lid: [0.03, 0.06], open_space_and_landscape: [0.15, 0.25], building_footprint: [0.25, 0.35]}
    unit: units
  wrap_multifamily:
    label: "Wrap apartments around a parking structure"
    density_basis: gross
    density: [41, 75]
    shares: {drives_and_structure: [0.30, 0.40], open_space_and_landscape: [0.10, 0.20], building_footprint: [0.40, 0.55]}
    unit: units
    structured_parking: true
  podium_multifamily:
    label: "Podium apartments"
    density_basis: gross
    density: [90, 115]
    shares: {podium_footprint: [0.60, 0.80], open_space_and_landscape: [0.10, 0.20]}
    unit: units
    structured_parking: true
  retail_surface:
    label: "Retail, surface parked"
    density_basis: gross
    far: [0.20, 0.30]
    shares: {parking_and_drives: [0.50, 0.60], landscape_and_setbacks: [0.15, 0.20], building_footprint: [0.20, 0.30]}
    unit: square_feet
  office_surface:
    label: "Office, surface parked"
    density_basis: gross
    far: [0.30, 0.40]
    shares: {parking_and_drives: [0.45, 0.55], landscape_and_setbacks: [0.15, 0.20], building_footprint: [0.25, 0.35]}
    unit: square_feet
  industrial_logistics:
    label: "Industrial and logistics"
    density_basis: gross
    far: [0.35, 0.50]
    shares: {truck_courts_and_parking: [0.35, 0.45], landscape_and_detention: [0.10, 0.15], building_footprint: [0.40, 0.50]}
    unit: square_feet
  mixed_use_corridor:
    label: "Mixed use on a corridor"
    density_basis: gross
    far: [1.0, 2.0]
    shares: {building_footprint: [0.50, 0.70], open_space_and_landscape: [0.10, 0.20], drives_and_structure: [0.15, 0.30]}
    unit: square_feet
defaults_by_type:            # the scenario set the model drafts when the planner has not written one
  greenfield: {residential: [client_program, single_family_subdivision, by_right]}
  infill: {residential: [client_program, tuck_under_multifamily, townhomes_attached]}
  redevelopment: {residential: [client_program, mixed_use_corridor, by_right]}
  rural_resource: {residential: [client_program, rural_residential, by_right]}
  public_infrastructure: {}
