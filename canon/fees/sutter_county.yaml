# Sutter County. Processing fees from the adopted schedule as carried in the Riego Rd program of 21 Sept 2026.
# Impact-fee families are listed with no amount until the fee table arrives (DATA-NEEDS item 9).
schedules:
  - id: fee.sutter.processing
    name: "Sutter County planning processing fees"
    owner: "Sutter County"
    kind: processing
    scope: {jurisdiction: "Sutter County"}
    source: {document: "Sutter County Development Services fee schedule, as carried in the Riego Rd program budget", revised: "2026-09-21"}
    effective: "2026-07-01"
    review_by: "2027-07-01"
    lines:
      - {id: gpa, label: "General Plan amendment", basis: flat, amount: 9911, lands: "At application.", when: {approval: "General Plan amendment"}}
      - {id: rezone, label: "Rezone", basis: flat, amount: 9911, lands: "At application.", when: {approval: "Rezone"}}
      - {id: vtm, label: "Vesting tentative subdivision map", basis: flat, amount: 11781, lands: "At application.", when: {approval: "Tentative subdivision map"}}
      - {id: eir_deposit, label: "EIR review deposit", basis: range, low: 20000, high: 40000, lands: "At Notice of Preparation; actual cost against the deposit.", when: {assumption: assume.ceqa_pathway, current: eir}}
  - id: fee.sutter.impact
    name: "Sutter County development impact fees"
    owner: "Sutter County"
    kind: facility
    scope: {jurisdiction: "Sutter County"}
    source: {document: "Sutter County adopted development impact fee schedule", revised: null}
    effective: null
    review_by: null
    lines:
      - {id: transportation, label: "Transportation impact fee", basis: per_unit, amount: null, applies_to: [residential], verify: "Sutter County adopted impact fee schedule, roads chapter", lands: "At building permit."}
      - {id: drainage, label: "Drainage fee", basis: per_acre, amount: null, verify: "Sutter County drainage fee ordinance for the drainage zone", lands: "At final map or building permit."}
      - {id: park, label: "Park land dedication or in-lieu fee (Quimby)", basis: per_unit, amount: null, applies_to: [residential], verify: "Sutter County Quimby ordinance and park district schedule", lands: "At final map."}
      - {id: school, label: "School facilities fee (Level I or II)", basis: per_sqft, amount: null, applies_to: [residential], verify: "School district Level I or II fee resolution for the attendance area", lands: "At building permit."}
      - {id: facilities, label: "County facilities fees (fire, sheriff, library, general government)", basis: per_unit, amount: null, applies_to: [residential], verify: "Sutter County adopted impact fee schedule", lands: "At building permit."}
      - {id: sewer_water, label: "Sewer and water connection fees", basis: per_edu, amount: null, verify: "Serving district connection fee schedule once the wastewater path is set", lands: "At building permit."}
