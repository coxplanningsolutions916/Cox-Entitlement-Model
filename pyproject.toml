[project]
name = "cox-entitlement-model"
version = "0.1.0"
description = "Cox Planning Solutions entitlement program model: facts with provenance, a deterministic fee build, confidence composition, strategy rules, and season-window scheduling. Riego Rd Task Order 1 is the regression fixture ($273,000 / 1,463 hours)."
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
