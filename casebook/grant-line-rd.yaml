decisions:
  - {date: "2026-09-25", by: "Chris Cox", call: "Sell a $500 preliminary permit analysis rather than a $1,000 Step 1 screening or a free consult", alternatives: ["$1,000 Step 1 floor", "free advice and a proposal for the application", "decline"], why: "Small, simple, a walk-in operator with a decision to make this week; the letter answers the one question that gates everything else and sets up the application engagement", cost_or_saving: "$500 at break-even on MSRP; the follow-on is $7,500 to $10,000", source: "Granola 2026-09-25; handoff memo"}
  - {date: "2026-09-25", by: "Chris Cox", call: "Advise the client not to operate or charge before the CUP and business license, and to hold permanent installation", alternatives: ["say nothing", "soft-open"], why: "Operating before approval risks code enforcement and could cost grant eligibility; personal use of installed equipment is different from running a business", cost_or_saving: "protects the application and the grant", source: "Granola 2026-09-25; Roadmap section 8"}
  - {date: "2026-10-01", by: "Chris Cox", call: "Request up to three bays and about 25 occupants in every document, counting staff and guests, not players only", alternatives: ["two bays and 8 to 10 people as the client first described"], why: "Adding a bay later would need a CUP amendment; occupancy drives restroom and occupancy-class findings", cost_or_saving: "avoids an amendment cycle", source: "Productive task comment v4, 2026-10-01"}
  - {date: "2026-10-01", by: "Chris Cox", call: "Split the plans into a conceptual architectural plan for the CUP and stamped improvement-level plans for the building permit, the latter through Barbara", alternatives: ["one stamped set up front"], why: "The CUP exhibits need no license; the stamp is needed at the building permit; the concept becomes the basis for the permit set so nothing is redrawn", cost_or_saving: "keeps the CUP-stage cost at $1,500 to $2,500", source: "Productive task comments v4 and v6"}
  - {date: "2026-10-02", by: "Chris Cox", call: "Size the parking analysis to 7 spaces so the application works under either classification, and remove the earlier advice to describe the use as entertainment", alternatives: ["argue for the 2-stall classification"], why: "Leaving lessons and leagues out of the description to keep the lower ratio would put the CUP at risk if they came up later; the firm does not game classifications", cost_or_saving: "a 7-stall showing is easy on a lot with 75 to 90 stalls", source: "Productive task comment v7, 2026-10-02"}
  - {date: "2026-10-02", by: "Chris Cox", call: "Add the shared-parking fallback under EGMC 23.58.060(D) and an optional study-and-agreement service if the 10 percent test is triggered", alternatives: ["leave the risk unaddressed"], why: "Simulator demand peaks evenings and weekends against weekday industrial tenants; the code encourages shared parking and the fallback keeps the path open", cost_or_saving: "$1,500 to $3,000 only if triggered", source: "Productive task comment v8, 2026-10-02"}
  - {date: "2026-10-02", by: "Chris Cox", call: "Style: no bold lead-in labels, no inline bolding, no confidence tags in the client letter; bold only on the Re: line and table headers", alternatives: ["keep the tagged, labeled format"], why: "The letter reads as advice, not as a template", cost_or_saving: "none", source: "Productive task comment v9, 2026-10-02"}

resolutions:
  - {challenge: C1, fix: "Read the use table directly: every fitting classification is a CUP in HI; the MUP exists only in LI and MP, which is how the neighbors at 10461 to 10481 (MP) got minor permits; told the client in the cover line 'a CUP, not a MUP'", duration: "one evening", cost: "inside the $500", repeat: "yes; this is the Screen's job"}
  - {challenge: C2, fix: "Advice not to operate before approval; occupancy and bays set to the maximum the client might want so the permit does not need amending", duration: "same meeting", cost: "none", repeat: "yes; lead with it for every operator"}
  - {challenge: C3, fix: "Parking analysis sized to the stricter classification; lessons, coaching and leagues written into the project description; a question to staff on which classification applies and how the Elk Grove Golf Studio was classified", duration: "one draft cycle", cost: "none now; 7 stalls on a 75 to 90 stall lot", repeat: "yes; a playbook rule for use-permit screens"}
  - {challenge: C4, fix: "The 10 percent test explained with its inputs; landlord asked for the site plan with stall counts, tenant uses and the suite's last approved use; shared-parking fallback drafted", duration: "one draft cycle", cost: "optional $1,500 to $3,000 if triggered", repeat: "yes"}
  - {challenge: C5, fix: "Carried the range, named the $520 gap, and asked staff for an itemization rather than guessing", duration: "one evening", cost: "none", repeat: "yes; never reconcile a quote by inventing a line"}
  - {challenge: C6, fix: "Used as directed, recorded as below floor; the Screen price has since been set at $500 with one staff hour, which makes this the right price for the product", duration: "n/a", cost: "break-even", repeat: "the floor question is answered by the ladder"}
  - {challenge: C7, fix: "Proposal and invoice sent within an hour of the client's follow-up; letter delivered three business days after signature", duration: "n/a", cost: "a client nudge", repeat: "the Screen clock now runs from order confirmation and the hooks send the proposal and invoice at order"}
  - {challenge: C8, fix: "A Tier 1 Roadmap template was filed to Proposal Templates so the structure does not have to be rebuilt; the model's report generator now carries it", duration: "done during v6", cost: "unlogged hours", repeat: "log the drafting hours; let the generator hold the structure"}
  - {challenge: C9, fix: "Open: the opportunity should move to Roadmap Delivered (or Closed Won for the $500) and a new opportunity should carry the follow-on; the part 1 delivered hook does this on sign-off", duration: "open", cost: "attribution noise", repeat: "the hook removes it"}

