lessons:
  - {kind: rule, rule: "proposed R21", lesson: "When agency correspondence names two permit types, the Screen reads the use table itself and cites the row; the client never pays fees on a staff sentence.", applies_to: ["use permits", "operator cases", "all types"]}
  - {kind: playbook, lesson: "Size the parking analysis to the stricter plausible classification and write every activity the client might offer (lessons, leagues, a third bay) into the project description; an amendment costs more than the stalls.", applies_to: ["CUP", "infill", "redevelopment"]}
  - {kind: judgment, lesson: "Do not advise a client to describe a use so it lands in a lighter classification; the firm's credibility with staff is worth more than five stalls.", why_judgment: "an ethics line, not a computable check; it belongs in the reviewer checklist as a question"}
  - {kind: playbook, lesson: "For an operator who has already signed a lease and bought equipment, the first advice is about what not to do before approval; the permit path comes second.", applies_to: ["operator persona"]}
  - {kind: benchmark, lesson: "Elk Grove CUP (major) $8,800 plus CEQA Tier 2 deposit $1,000 plus NOE $50 in 2026; staff quote about six months; Cox estimate four to seven months to a decision.", applies_to: ["City of Elk Grove", "CUP"]}
  - {kind: process, lesson: "Reconcile a staff fee quote to the adopted booklet line by line; carry the range and ask for the itemization rather than closing the gap by guessing.", applies_to: ["all fee estimates"]}
  - {kind: process, lesson: "A $500 letter that takes nine drafts is a template problem, not a scope problem; the generator holds the structure and the planner spends the hour on judgment.", applies_to: ["Screen production"]}
  - {kind: process, lesson: "Log the drafting hours even when a fee is fixed; the error rate and the cost per Screen are only as good as the time record.", applies_to: ["Screen production", "correction register"]}
  - {kind: playbook, lesson: "Put the client's follow-up questions in the deliverable itself (legal name, hours, programming, lessons share, prior use, landlord contact); the next proposal writes itself from the answers.", applies_to: ["Screen", "Map"]}
  - {kind: process, lesson: "Move the opportunity on delivery and open a new one for the follow-on; otherwise the funnel counts a delivered Roadmap as an unsigned proposal.", applies_to: ["Automator", "part 1 hooks"]}

