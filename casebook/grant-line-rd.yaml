summary: >
  An operator case. Two partners leased a 1,400-square-foot suite in a Heavy Industrial building in August 2026 to run a
  two-bay indoor golf simulator studio, ordered the simulators, then learned at the business-license counter that the use
  needs planning review. City staff said "CUP in the HI" but also mentioned a minor use permit, and quoted $10,370 in fees
  and about six months. Cox sold a $500 preliminary permit analysis the day after the inquiry, confirmed from the City's own
  use table that every fitting classification needs a full CUP in HI (the MUP only exists in the neighbors' MP zone), found
  that the classification the City picks changes required parking from 2 stalls to 7, sized the analysis to 7, told the client
  not to operate before approval, and delivered a nine-page roadmap three business days after signature with a priced path
  to a CUP decision. The follow-on application engagement is the open opportunity.
