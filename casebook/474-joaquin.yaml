lessons:
  - {kind: rule, rule: "proposed R22", lesson: "On any site with a channel, the Screen states both jurisdictional datums (federal OHWM; state top of bank and riparian canopy) and the model carries the state figure as the planning case until a state-standard delineation says otherwise.", applies_to: ["all types with waters", "Screen", "Map"]}
  - {kind: rule, rule: "proposed R24", lesson: "The assessment area is fixed and signed off by the client, the civil engineer and the lead agency before any study, plan or permit application starts; the model treats any later change to the assessment or permit area as a full redo of every deliverable built on it, and prices and schedules it that way.", applies_to: ["Step 1b", "Step 2", "Step 4", "all types with waters or off-site drainage"]}
  - {kind: rule, rule: "proposed R23", lesson: "One project description, one owner: the CEQA document, every resource permit and the map cite the same acreage, unit count, impact figures and entity name from a single record; a Roadmap that shows a Town-run CEQA document and a Cox-run permit set flags the split as a risk with a cost.", applies_to: ["Step 3", "Step 4", "all types"]}
  - {kind: playbook, lesson: "Delineate to the stricter standard and run the protocol plant survey in the first available window, before the CEQA path is chosen; a missed June-July window is a year.", applies_to: ["Step 1b", "mountain and desert jurisdictions", "CDFW Region 6"]}
  - {kind: playbook, lesson: "Any culverted or piped reach upstream of the site is a Screen question: who owns it, what happens to it if the on-site channel is dewatered, and will the agencies ask for it as mitigation.", applies_to: ["Screen", "infill with channels"]}
  - {kind: playbook, lesson: "Answer an agency's extension or status request the same day, in writing, with the reason; four extensions cost nothing and a lapsed clock costs a renotification.", applies_to: ["1602", "401", "all agency clocks"]}
  - {kind: judgment, lesson: "When the lead agency is deciding between a clarified MND and an EIR, put the clarification argument and the phased alternative in writing before the resource-agency letters land, and tell the client what each path costs them in months and deposits before the Town decides.", why_judgment: "timing and tone with a lead agency are a principal's call; the model can only flag that the decision is pending and price both paths"}
  - {kind: judgment, lesson: "When a client says they cannot afford the change order, accept the pause, finish the signed scope, keep the clocks open, and offer to re-scope; the firm's exposure is smaller than the relationship.", why_judgment: "a cash and relationship read, not a computable check"}
  - {kind: playbook, lesson: "A third-party deliverable the whole schedule waits on (the engineer's boundary) goes in the roadmap as a named milestone with an owner and a date the client can see, not only in Cox's task list.", applies_to: ["Map", "dashboard Gantt", "Step 2 onward"]}
  - {kind: playbook, lesson: "Flag every standard met at zero margin (height, open space, density headroom) and re-check it the day a boundary or grade moves.", applies_to: ["Map", "infill", "design review"]}
  - {kind: process, lesson: "Legal entity of the applicant and the owner is an intake field, confirmed by the client, before anything is filed; six names on one project is a re-notice waiting to happen.", applies_to: ["Screen intake", "part 1 hooks"]}
  - {kind: process, lesson: "Run the Project Record conflict pass over Cox's own documents before they leave; the AA's HDR-2 label, the 39 units and the Arid West citation were ours.", applies_to: ["review sign-off", "R20 corrections register"]}
  - {kind: process, lesson: "Price the whole path with phases and triggers at the first change order, and recover CEQA coordination as a line, not as unbudgeted PM.", applies_to: ["change orders", "program.py"]}
  - {kind: benchmark, lesson: "Mammoth Lakes: 1602 notification to deemed complete about 5.5 months (incomplete once); CDFW draft agreement held by mutual extension for seven-plus months; Town EIR about nine months best case with about 75 statutory days; Region 6 mitigation 3:1 on general bank credits at about $300,000 per acre vs about $1,000,000 in-lieu.", applies_to: ["Town of Mammoth Lakes", "CDFW Region 6", "Lahontan"]}
  - {kind: process, lesson: "AB 52 consultation is the lead agency's row on every CEQA schedule, restarts at the NOP, and someone on the team is named to watch it.", applies_to: ["Step 3", "schedule cascade"]}

