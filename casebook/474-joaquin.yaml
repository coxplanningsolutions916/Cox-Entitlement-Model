summary: >
  A permits-first case that became a CEQA case. The client bought three parcels in Mammoth Lakes with a 2022 delineation in
  hand, hired Cox in 2025 to get the Section 404, 401 and 1602 authorizations for a 38-unit duplex and triplex subdivision,
  and let the Town run a separate IS/MND through its own consultant. Cox filed all three applications on the 2022 delineation
  in the fall of 2025. The CDFW and Water Board site inspection of 5 May 2026 reset the baseline: the state measures to top of
  bank and riparian canopy, not the federal ordinary high water mark, so state waters grew from 0.042 to about 0.187 acres,
  riparian impact of 0.488 acres appeared that the IS/MND never analyzed, and the agencies pointed at the off-site reach
  between the Meridian culvert and the property that the project would dewater. The single biggest cost and schedule driver was the change in the assessment area itself:
  once the upstream off-site drainage and the public storm sewer down Meridian Road and Joaquin Road were pulled into the
  project, every study, plan and permit application built on the on-site boundary had to be redone. Cox re-ran the delineation to the state
  standard, ran the protocol rare plant survey in season, argued in June for an IS/MND clarification with a phased off-site
  action, and lost that argument in July when the Town directed an EIR. Cox then held the three agency clocks open by mutual
  extension four times, wrote a 149-parameter Project Record so the EIR, the three permits and the tract map would carry one
  set of numbers, and priced a $110,327.50 change order for the EIR path. The client said they could not afford it, asked
  Cox to finish the signed scope and pause, and put the project on hold on 1 October 2026 with a four-month slip. No permit
  has issued. The case is the firm's clearest record of what it costs when the CEQA document and the permit applications are
  run by different teams on different delineations.
