decisions:
  - {date: "2025-09", by: "Chris Cox", call: "File 404, 401 and 1602 in parallel on the 2022 delineation while the Town ran its IS/MND, rather than wait for CEQA", alternatives: ["re-delineate to the state standard first", "wait for the MND to adopt"], why: "The 2022 report was the record; the Water Board would need CEQA anyway; parallel filing starts the clocks", cost_or_saving: "all three applications now need amending; months of agency review spent on superseded figures", source: "Gmail 2025-09 filings; Kristin 2025-09-15"}
  - {date: "2026-06-04", by: "Chris Cox", call: "Accept every CDFW extension offer immediately and in writing", alternatives: ["let the 60-day clock run and receive a draft agreement on the wrong figures", "withdraw and renotify"], why: "A draft agreement on the 2022 figures would have to be amended; mutual extension keeps the notification complete and the relationship intact", cost_or_saving: "no refiling fee; a draft agreement due 2027-01-01", source: "CDFW thread, four agreements"}
  - {date: "2026-06-08", by: "Chris Cox", call: "Argue for IS/MND clarification with the off-site reach as a separate, later action, citing 15073.5", alternatives: ["concede an EIR in June", "ignore the off-site reach"], why: "Recirculation of a clarified MND is months; an EIR is a year and a deposit regime; the off-site work is on land the client does not control", cost_or_saving: "lost in July; about one month spent on the argument", source: "Town IS-MND memo 2026-06-05; Gmail 2026-06-08"}
  - {date: "2026-06", by: "Chris Cox", call: "Re-run the delineation to the state standard and the rare plant survey in season at once, before the EIR decision", alternatives: ["wait for the Town's direction", "defer the plant survey a year"], why: "CDFW rejected the 2022 reconnaissance as non-floristic and out of season; missing the June to July window would cost a full year", cost_or_saving: "$7,252 and $16,931 invoiced against the CO1 caps; a year saved", source: "Gmail, Chris to CDFW 2026-06-22 and 2026-08-11; CAJA thread 07-17"}
  - {date: "2026-07-23", by: "Chris Cox", call: "Propose five to ten channel cross-sections for the fill-volume question instead of a full drainage model; the civil engineer owns the boundary", alternatives: ["commission a full hydraulic model", "let Cox draw the boundary"], why: "The agencies asked for a quantity, not a model; the boundary is an engineer-of-record deliverable", cost_or_saving: "a model avoided; a dependency on an engineer who then did not deliver", source: "Granola 2026-07-23; Productive task 19141637"}
  - {date: "2026-08-26", by: "Chris Cox", call: "Build a single Project Record with one value per parameter, a citation, a status, and live Open Items and Conflicts views, and circulate it without any fee figures so the whole team can use it", alternatives: ["keep reconciling document by document", "let CAJA own the project description"], why: "Five documents disagreed on acreage, density, unit count, zoning label and impact figures; the EIR project description will be copied into three permits and a map", cost_or_saving: "one day to build; found the 38.591 du/ac error before the EIR repeated it", source: "Project Record Read Me, revision log"}
  - {date: "2026-09-10", by: "Chris Cox", call: "Scope CO2 for the full EIR path with phasing A and B and triggers (NOP, Draft EIR), carrying recovery of incurred CEQA coordination", alternatives: ["a small CO to finish the signed deliverables only", "T&M without a ceiling"], why: "The client should see the whole cost of the path the Town chose; triggers let the client fund in steps", cost_or_saving: "$110,327.50 proposed; declined", source: "CO handoff memo Rev 6; Gmail 2026-09-15"}
  - {date: "2026-09-16", by: "Chris Cox", call: "Accept the pause, finish the signed scope, offer to re-scope for affordability, and keep the agency clocks open", alternatives: ["stop work pending CO2", "insist on the full CO"], why: "The firm's exposure is the unfunded expanded area; the client's is the EIR; the relationship and the notification are worth more than the argument", cost_or_saving: "unbilled effort on the expanded area; a January 2027 deadline held", source: "Gmail 2026-09-16; CDFW thread 09-21"}

