interview_questions:
  - "The assessment area grew to the off-site drainage and the Meridian/Joaquin storm sewer, and that redo is what cost the most. Who set the original on-site boundary, and what question in 2024 or 2025 would have caught the storm sewer connection before the studies started?"
  - "In September 2025 you filed all three applications on the 2022 federal-standard delineation. Knowing CDFW Region 6 measures to top of bank, would you re-delineate first next time, or was parallel filing still right because the Town's CEQA was the long pole?"
  - "The Town ran its own IS/MND through its consultant while Cox ran the permits. What would you have asked for in the 2024 proposal to own the project description, and would the client have paid for it?"
  - "The June memo argued for clarification under 15073.5 and lost. Was there a week in May when that argument would have landed, and what did the Town actually weigh?"
  - "The client told the Town he would meet Council without his legal team. Did that help or hurt, and should Cox have been in that room?"
  - "You held the CDFW clock open four times. Is there a point where you would let it lapse and renotify instead, and what is the signal?"
  - "The Project Record took one day and found errors in Cox's own AA. Should that pass run before every deliverable leaves, and who runs it when you are not available?"
  - "CO2 was $110,000 against a client burning $100,000 a month. Was there a $40,000 phase A you would have led with, and what would it have covered?"
  - "The engineer's boundary has been overdue since August and the client is chasing it. What does Cox do when the client's own consultant is the critical path?"
  - "Mitigation at $300,000 per acre on bank credits versus about $1,000,000 in-lieu: how firm are those numbers and which agency conversation moves them?"
  - "For the model: which of these would you want the Screen to say to the next buyer of a Mammoth parcel with a channel, in one paragraph?"
